<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Magic - 声で魔法を唱えよう</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');
  body{
    overflow:hidden;
    background:#0a0a1a;
    font-family:'MedievalSharp','Georgia',serif;
    color:#e0d8c8;
    user-select:none;
  }
  canvas#magicCanvas{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
  }
  #ui{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #ui>*{pointer-events:auto}
  h1{
    font-size:clamp(1.8rem,5vw,3.5rem);
    text-align:center;
    background:linear-gradient(135deg,#f0c27f,#fc5c7d,#6a82fb);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:10px;
    text-shadow:0 0 40px rgba(106,130,251,.3);
    filter:drop-shadow(0 0 10px rgba(240,194,127,.3));
  }
  #subtitle{
    font-size:clamp(.85rem,2vw,1.1rem);opacity:.7;margin-bottom:30px;text-align:center;
  }
  #micBtn{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#2a1f4e,#1a1035);
    border:3px solid rgba(106,130,251,.4);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .3s;position:relative;
    box-shadow:0 0 30px rgba(106,130,251,.2),inset 0 0 30px rgba(106,130,251,.1);
  }
  #micBtn:hover{transform:scale(1.08);border-color:rgba(106,130,251,.8);box-shadow:0 0 50px rgba(106,130,251,.4)}
  #micBtn.listening{
    border-color:#fc5c7d;
    box-shadow:0 0 50px rgba(252,92,125,.5),inset 0 0 30px rgba(252,92,125,.2);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 50px rgba(252,92,125,.5)}
    50%{box-shadow:0 0 80px rgba(252,92,125,.8)}
  }
  #micBtn svg{width:48px;height:48px;fill:#e0d8c8;transition:fill .3s}
  #micBtn.listening svg{fill:#fc5c7d}
  #micRing{
    position:absolute;width:100%;height:100%;border-radius:50%;
    border:2px solid transparent;animation:none;
  }
  #micBtn.listening #micRing{
    border-color:rgba(252,92,125,.5);animation:ringPulse 2s infinite;
  }
  @keyframes ringPulse{
    0%{transform:scale(1);opacity:1}
    100%{transform:scale(1.8);opacity:0}
  }
  #status{
    margin-top:20px;font-size:1rem;opacity:.8;
    min-height:1.5em;text-align:center;transition:all .3s;
  }
  #transcript{
    margin-top:10px;font-size:1.4rem;
    min-height:1.8em;text-align:center;
    color:#f0c27f;
    text-shadow:0 0 20px rgba(240,194,127,.5);
    transition:all .3s;
  }
  #spellBook{
    position:fixed;bottom:0;left:0;right:0;
    z-index:3;pointer-events:auto;
    background:rgba(10,10,26,.9);
    border-top:1px solid rgba(106,130,251,.3);
    padding:10px 15px 12px;
    backdrop-filter:blur(10px);
    max-height:40vh;overflow-y:auto;
  }
  #spellBook h3{
    font-size:.85rem;opacity:.6;margin-bottom:6px;text-align:center;
  }
  .spell-category{
    margin-bottom:6px;
  }
  .spell-category-label{
    font-size:.7rem;opacity:.4;margin-bottom:3px;padding-left:4px;
  }
  #spellList{
    display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
  }
  .spell-tag{
    padding:3px 10px;border-radius:16px;font-size:.75rem;
    cursor:pointer;transition:all .3s;white-space:nowrap;
  }
  .spell-tag:hover{transform:scale(1.08);filter:brightness(1.3)}
  .cat-fire{background:rgba(255,80,30,.2);border:1px solid rgba(255,80,30,.4);color:#ff8855}
  .cat-lightning{background:rgba(255,255,80,.2);border:1px solid rgba(255,255,80,.4);color:#ffff88}
  .cat-ice{background:rgba(100,180,255,.2);border:1px solid rgba(100,180,255,.4);color:#88ccff}
  .cat-heal{background:rgba(80,255,120,.2);border:1px solid rgba(80,255,120,.4);color:#80ff88}
  .cat-water{background:rgba(80,160,255,.2);border:1px solid rgba(80,160,255,.4);color:#66aaff}
  .cat-shield{background:rgba(80,220,220,.2);border:1px solid rgba(80,220,220,.4);color:#77dddd}
  .cat-utility{background:rgba(180,130,255,.2);border:1px solid rgba(180,130,255,.4);color:#bb99ff}
  .cat-enhance{background:rgba(255,215,80,.2);border:1px solid rgba(255,215,80,.4);color:#ffdd66}
  .cat-detect{background:rgba(130,180,255,.2);border:1px solid rgba(130,180,255,.4);color:#99bbff}

  #castEffect{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:10;pointer-events:none;opacity:0;transition:opacity .15s;
  }
  #castEffect.active{opacity:1}
  #castEffect.flash{
    opacity:1;background:rgba(255,255,255,0.35)!important;
    transition:opacity .08s;
  }
  #spellDisplay{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5);
    z-index:11;pointer-events:none;text-align:center;
    opacity:0;transition:all .4s cubic-bezier(0.18,0.89,0.32,1.28);
  }
  #spellDisplay.show{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  #spellDisplayName{
    font-size:clamp(2.5rem,10vw,5.5rem);
    text-shadow:0 0 60px currentColor, 0 0 120px currentColor;
    letter-spacing:0.1em;
  }
  #spellDisplayDesc{
    font-size:clamp(1rem,3vw,1.5rem);
    opacity:.8;margin-top:8px;
    text-shadow:0 0 20px currentColor;
  }
  @keyframes screenShake{
    0%,100%{transform:translate(0,0)}
    10%{transform:translate(-4px,3px)}
    20%{transform:translate(5px,-3px)}
    30%{transform:translate(-3px,-4px)}
    40%{transform:translate(4px,4px)}
    50%{transform:translate(-5px,2px)}
    60%{transform:translate(3px,-5px)}
    70%{transform:translate(-2px,4px)}
    80%{transform:translate(5px,-2px)}
    90%{transform:translate(-4px,3px)}
  }
  body.shaking canvas{animation:screenShake 0.3s ease-out}
  .no-speech{
    font-size:.85rem;opacity:.5;margin-top:15px;text-align:center;
    max-width:400px;line-height:1.5;
  }
</style>
</head>
<body>
<canvas id="magicCanvas"></canvas>
<div id="castEffect"></div>
<div id="spellDisplay">
  <div id="spellDisplayName"></div>
  <div id="spellDisplayDesc"></div>
</div>
<div id="ui">
  <h1>Voice Magic</h1>
  <div id="subtitle">マイクに向かって呪文を唱えよう</div>
  <button id="micBtn" aria-label="マイクを起動">
    <div id="micRing"></div>
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <div id="status">タップしてマイクを起動</div>
  <div id="transcript"></div>
</div>
<div id="spellBook">
  <h3>📖 呪文一覧 - Spell Book</h3>
  <div id="spellList">
    <span class="spell-tag cat-fire" data-spell="feilanze">ファイランツェ (炎の槍)</span>
    <span class="spell-tag cat-fire" data-spell="feuerball">フォイアーバル (火球)</span>
    <span class="spell-tag cat-lightning" data-spell="blitzpfeil">ブリツォール (雷の矢)</span>
    <span class="spell-tag cat-ice" data-spell="frostspeer">フロスピア (氷の槍)</span>
    <span class="spell-tag cat-heal" data-spell="schnellheil">シュネルハイル (応急手当)</span>
    <span class="spell-tag cat-water" data-spell="siedeln">ジーデルン (お湯を沸かす)</span>
    <span class="spell-tag cat-shield" data-spell="barriere">バリエーレ (簡素防護)</span>
    <span class="spell-tag cat-shield" data-spell="gardiere">ガーディエーレ (強化防護)</span>
    <span class="spell-tag cat-shield" data-spell="bastiere">バスティエーレ (鉄壁)</span>
    <span class="spell-tag cat-utility" data-spell="flicken">フリッケン (服を治す)</span>
    <span class="spell-tag cat-utility" data-spell="schleiern">シュライアン (記憶を曇らせる)</span>
    <span class="spell-tag cat-enhance" data-spell="sichtbar">ジヒトバール (イブングハジの粉)</span>
    <span class="spell-tag cat-enhance" data-spell="glanzklinge">グランツクリンゲ (光る刃)</span>
    <span class="spell-tag cat-enhance" data-spell="eisenleib">アイゼンライプ (鉄の体)</span>
    <span class="spell-tag cat-detect" data-spell="manasinn">マナジン (魔力探知)</span>
    <span class="spell-tag cat-detect" data-spell="zauberpfeil">ツァウベロール (魔法の矢)</span>
  </div>
</div>
<script>
// ===== CANVAS SETUP =====
const canvas = document.getElementById('magicCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// ===== AMBIENT PARTICLES =====
const ambientParticles = [];
for (let i = 0; i < 60; i++) {
  ambientParticles.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.3, dy: (Math.random() - 0.5) * 0.3 - 0.2,
    opacity: Math.random() * 0.5 + 0.1, hue: Math.random() * 60 + 220,
  });
}
function drawAmbient() {
  ambientParticles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.y < -10) p.y = H + 10;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue},70%,70%,${p.opacity})`;
    ctx.fill();
  });
}

// ===== MAGIC CIRCLE =====
let magicCircle = { active: false, radius: 0, targetRadius: 0, opacity: 0, rotation: 0, hue: 240 };
function drawMagicCircle() {
  if (magicCircle.opacity < 0.01) return;
  const cx = W / 2, cy = H / 2;
  magicCircle.rotation += 0.005;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(magicCircle.rotation);
  ctx.globalAlpha = magicCircle.opacity;
  ctx.beginPath(); ctx.arc(0, 0, magicCircle.radius, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${magicCircle.hue},80%,70%,0.6)`; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, magicCircle.radius * 0.7, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${magicCircle.hue},80%,70%,0.4)`; ctx.lineWidth = 1.5; ctx.stroke();
  const sides = 6;
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const x1 = Math.cos(a) * magicCircle.radius * 0.85, y1 = Math.sin(a) * magicCircle.radius * 0.85;
    const x2 = Math.cos(a + Math.PI * 2 / sides) * magicCircle.radius * 0.85;
    const y2 = Math.sin(a + Math.PI * 2 / sides) * magicCircle.radius * 0.85;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = `hsla(${magicCircle.hue},80%,70%,0.3)`; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${magicCircle.hue},80%,80%,0.6)`; ctx.fill();
  }
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + magicCircle.rotation * 2;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * magicCircle.radius * 0.65, Math.sin(a) * magicCircle.radius * 0.65);
    ctx.strokeStyle = `hsla(${magicCircle.hue},60%,60%,0.2)`; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
}

// ===== SPELL PARTICLES =====
let spellParticles = [];
class SP {
  constructor(x, y, c) {
    this.x = x; this.y = y;
    this.vx = c.vx || 0; this.vy = c.vy || 0;
    this.life = c.life || 1; this.decay = c.decay || 0.01;
    this.r = c.r || 3; this.hue = c.hue || 0;
    this.sat = c.sat || 80; this.light = c.light || 60;
    this.gravity = c.gravity || 0; this.trail = c.trail || false;
    this.th = []; this.friction = c.friction || 0.99;
    this.glow = c.glow || false;
  }
  update() {
    if (this.trail) { this.th.push({x:this.x,y:this.y}); if (this.th.length > 8) this.th.shift(); }
    this.vx *= this.friction; this.vy *= this.friction;
    this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
    this.life -= this.decay;
  }
  draw(c) {
    if (this.life <= 0) return;
    const a = Math.max(0, this.life);
    if (this.trail) {
      for (let i = 0; i < this.th.length; i++) {
        const t = this.th[i], ta = (i / this.th.length) * a * 0.5;
        c.beginPath(); c.arc(t.x, t.y, this.r * (i / this.th.length), 0, Math.PI * 2);
        c.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${ta})`; c.fill();
      }
    }
    if (this.glow) { c.save(); c.shadowBlur = 20; c.shadowColor = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`; }
    c.beginPath(); c.arc(this.x, this.y, this.r * a, 0, Math.PI * 2);
    c.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`; c.fill();
    if (this.glow) c.restore();
  }
}

// ===== SPELL DEFINITIONS =====
const spells = {
  feilanze: {
    name: 'ファイランツェ', desc: '炎の槍',
    keywords: ['ファイランツェ', 'ふぁいらんつぇ', '炎の槍', 'ほのおのやり', 'ファイラン', 'ファイランツエ', 'ファイランツ', 'ファイアランス', 'はいらんつぇ', 'ふぁいらん'],
    hue: 15, color: '#ff6030', screenColor: 'rgba(255,60,20,0.15)',
    cast(cx, cy) {
      for (let i = 0; i < 160; i++) {
        const spread = (Math.random() - 0.5) * 2;
        const speed = Math.random() * 14 + 8;
        spellParticles.push(new SP(cx + spread * 25, cy + 60, {
          vx: spread * 2.5, vy: -speed,
          hue: Math.random() * 40, sat: 95, light: 50 + Math.random() * 30,
          r: Math.random() * 7 + 3, gravity: -0.03, decay: 0.006,
          trail: true, glow: true, friction: 0.985,
        }));
      }
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          spellParticles.push(new SP(cx + (Math.random()-0.5)*50, cy - 250 - Math.random()*150, {
            vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
            hue: 35+Math.random()*25, sat: 100, light: 75+Math.random()*20,
            r: Math.random()*4+1.5, decay: 0.015, glow: true, friction: 0.94,
          }));
        }, i * 12);
      }
      // Smoke trail
      for (let i = 0; i < 30; i++) {
        spellParticles.push(new SP(cx+(Math.random()-0.5)*40, cy+40, {
          vx: (Math.random()-0.5)*1.5, vy: -Math.random()*2,
          hue: 20, sat: 30, light: 30+Math.random()*15,
          r: Math.random()*8+4, decay: 0.003, glow: false, friction: 0.998,
        }));
      }
    }
  },
  feuerball: {
    name: 'フォイアーバル', desc: '火球を放つ',
    keywords: ['フォイアーバル', 'ふぉいあーばる', '火球', 'かきゅう', '火球を放つ', 'フォイアー', 'ホイアーバル', 'ホイアー', 'ふぉいあー', 'ほいあーばる', 'フォイヤー'],
    hue: 20, color: '#ff4020', screenColor: 'rgba(255,50,10,0.18)',
    cast(cx, cy) {
      for (let i = 0; i < 300; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 3;
        spellParticles.push(new SP(cx, cy, {
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          hue: Math.random() * 45, sat: 95, light: 45 + Math.random() * 30,
          r: Math.random() * 9 + 3, gravity: -0.03, decay: 0.005,
          trail: true, glow: true, friction: 0.97,
        }));
      }
      // Core white flash
      for (let i = 0; i < 60; i++) {
        spellParticles.push(new SP(cx+(Math.random()-0.5)*20, cy+(Math.random()-0.5)*20, {
          vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
          hue: 45, sat: 100, light: 92,
          r: Math.random() * 14 + 6, decay: 0.012, glow: true, friction: 0.98,
        }));
      }
      // Secondary shockwave
      for (let i = 0; i < 80; i++) {
        const a = (i/80)*Math.PI*2;
        setTimeout(() => {
          spellParticles.push(new SP(cx+Math.cos(a)*30, cy+Math.sin(a)*30, {
            vx: Math.cos(a)*6, vy: Math.sin(a)*6,
            hue: 15+Math.random()*20, sat: 90, light: 60,
            r: Math.random()*5+2, decay: 0.008, trail: true, glow: true, friction: 0.975,
          }));
        }, 150);
      }
    }
  },
  blitzpfeil: {
    name: 'ブリツォール', desc: '雷の矢',
    keywords: ['ブリツォール', 'ぶりつぉーる', '雷の矢', 'かみなりのや', 'ブリツォ', 'ブリッツ', 'ぶりっつ', 'プリツォール', 'ブリツオール', 'ブリッツォール', 'ぶりつぉ'],
    hue: 55, color: '#ffff50', screenColor: 'rgba(255,255,80,0.2)',
    cast(cx, cy) {
      for (let b = 0; b < 6; b++) {
        let lx = cx + (Math.random()-0.5)*100;
        let ly = 0;
        while (ly < cy) {
          const nlx = lx + (Math.random()-0.5)*50;
          const nly = ly + Math.random()*25+12;
          for (let i = 0; i < 8; i++) {
            const t = i / 8;
            spellParticles.push(new SP(
              lx+(nlx-lx)*t+(Math.random()-0.5)*6,
              ly+(nly-ly)*t+(Math.random()-0.5)*6, {
                vx: (Math.random()-0.5)*1, vy: (Math.random()-0.5)*1,
                hue: 48+Math.random()*20, sat: 100, light: 82+Math.random()*18,
                r: Math.random()*4+1.5, decay: 0.02, glow: true, friction: 0.94,
              }));
          }
          lx = nlx; ly = nly;
        }
      }
      // Big impact burst
      for (let i = 0; i < 120; i++) {
        const angle = Math.random()*Math.PI*2;
        const sp = Math.random()*10+3;
        spellParticles.push(new SP(cx, cy, {
          vx: Math.cos(angle)*sp, vy: Math.sin(angle)*sp,
          hue: 50+Math.random()*15, sat: 100, light: 85+Math.random()*15,
          r: Math.random()*3+1, decay: 0.018, trail: true, glow: true, friction: 0.955,
        }));
      }
      // Electric ground arcs
      for (let i = 0; i < 40; i++) {
        const a = Math.random()*Math.PI*2;
        const d = Math.random()*60+20;
        spellParticles.push(new SP(cx+Math.cos(a)*d, cy+Math.sin(a)*d, {
          vx: Math.cos(a+0.5)*3, vy: Math.sin(a+0.5)*3,
          hue: 55, sat: 100, light: 95,
          r: Math.random()*2+0.5, decay: 0.03, trail: true, glow: true, friction: 0.93,
        }));
      }
    }
  },
  frostspeer: {
    name: 'フロスピア', desc: '氷の槍',
    keywords: ['フロスピア', 'ふろすぴあ', '氷の槍', 'こおりのやり', 'フロス', 'フロスト', 'ふろすと', 'プロスピア', 'フロスビア', 'ふろすぴ'],
    hue: 200, color: '#60c0ff', screenColor: 'rgba(80,180,255,0.15)',
    cast(cx, cy) {
      for (let i = 0; i < 140; i++) {
        const spread = (Math.random()-0.5)*1.8;
        const speed = Math.random()*13+7;
        spellParticles.push(new SP(cx+spread*20, cy+50, {
          vx: spread*2, vy: -speed,
          hue: 190+Math.random()*25, sat: 75, light: 65+Math.random()*25,
          r: Math.random()*6+2, decay: 0.005, trail: true, glow: true, friction: 0.984,
        }));
      }
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const angle = Math.random()*Math.PI*2;
          spellParticles.push(new SP(cx+(Math.random()-0.5)*60, cy-280-Math.random()*120, {
            vx: Math.cos(angle)*3, vy: Math.sin(angle)*3,
            hue: 195+Math.random()*15, sat: 50, light: 88+Math.random()*12,
            r: Math.random()*4+1.5, decay: 0.012, glow: true, friction: 0.95,
          }));
        }, i*10);
      }

// ===== SOUND EFFECTS (Web Audio API) =====
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
  return audioCtx;
}
function makeNoise(ctx, dur, decay) {
  const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*decay));
  const s = ctx.createBufferSource(); s.buffer=buf; return s;
}

// ===== UNIVERSAL CAST SOUND (plays before every spell) =====
function playCastSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Mystical ascending chime
  [440,660,880,1100,1320].forEach((f,i) => {
    const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now+i*0.04);
    g.gain.linearRampToValueAtTime(0.15, now+i*0.04+0.03);
    g.gain.exponentialRampToValueAtTime(0.001, now+i*0.04+0.35);
    osc.connect(g).connect(ctx.destination);
    osc.start(now+i*0.04); osc.stop(now+i*0.04+0.35);
  });
  // Deep magic rumble
  const osc = ctx.createOscillator(); osc.type='sawtooth';
  osc.frequency.setValueAtTime(55, now); osc.frequency.exponentialRampToValueAtTime(110, now+0.3);
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.4);
  osc.connect(lp).connect(g).connect(ctx.destination); osc.start(now); osc.stop(now+0.4);
  // Shimmer noise
  const n = makeNoise(ctx, 0.3, 0.15);
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
  const ng = ctx.createGain(); ng.gain.setValueAtTime(0.12, now); ng.gain.exponentialRampToValueAtTime(0.001, now+0.25);
  n.connect(hp).connect(ng).connect(ctx.destination); n.start(now);
}

      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now+D);
      break;
    }
    case 'sichtbar': {
      for (let i = 0; i < 18; i++) {
        const t = i*0.05;
        const f = 1000+Math.random()*3000;
        const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, now+D+t);
        g.gain.linearRampToValueAtTime(0.1, now+D+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now+D+t+0.2);
        osc.connect(g).connect(ctx.destination); osc.start(now+D+t); osc.stop(now+D+t+0.2);
      }
      // Shimmer pad
      const osc = ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=880;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.06, now+D); g.gain.exponentialRampToValueAtTime(0.001, now+D+0.8);
      osc.connect(g).connect(ctx.destination); osc.start(now+D); osc.stop(now+D+0.8);
      break;
    }
    case 'glanzklinge': {
      const n = makeNoise(ctx, 0.5, 0.12);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.setValueAtTime(400, now+D); bp.frequency.exponentialRampToValueAtTime(5000, now+D+0.15);
      bp.Q.value=1;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.45, now+D); g.gain.exponentialRampToValueAtTime(0.001, now+D+0.4);
      n.connect(bp).connect(g).connect(ctx.destination); n.start(now+D);
      // Ring
      [2000,3000].forEach((f,i) => {
        const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
        const og = ctx.createGain(); og.gain.setValueAtTime(0.15, now+D+0.08+i*0.05);
        og.gain.exponentialRampToValueAtTime(0.001, now+D+0.7);
        osc.connect(og).connect(ctx.destination); osc.start(now+D+0.08+i*0.05); osc.stop(now+D+0.7);
      });
      break;
    }
    case 'eisenleib': {
      [120,240,360,480].forEach((f,i) => {
        const osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=f;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.08, now+D+i*0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now+D+1);
        osc.connect(g).connect(ctx.destination); osc.start(now+D+i*0.08); osc.stop(now+D+1);
      });
      const n = makeNoise(ctx, 0.5, 0.1);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5000; bp.Q.value=5;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.25, now+D); ng.gain.exponentialRampToValueAtTime(0.001, now+D+0.3);
      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now+D);
      // Impact
      const boom = ctx.createOscillator(); boom.type='sine';
      boom.frequency.setValueAtTime(80, now+D); boom.frequency.exponentialRampToValueAtTime(30, now+D+0.5);
      const bg = ctx.createGain(); bg.gain.setValueAtTime(0.2, now+D); bg.gain.exponentialRampToValueAtTime(0.001, now+D+0.5);
      boom.connect(bg).connect(ctx.destination); boom.start(now+D); boom.stop(now+D+0.5);
      break;
    }
    case 'manasinn': {
      for (let i = 0; i < 7; i++) {
        const t = i*0.22;
        const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=880;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, now+D+t);
        g.gain.linearRampToValueAtTime(0.18, now+D+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now+D+t+0.35);
        osc.connect(g).connect(ctx.destination); osc.start(now+D+t); osc.stop(now+D+t+0.35);
      }
      // Sub bass sweep
      const osc = ctx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(40, now+D); osc.frequency.exponentialRampToValueAtTime(120, now+D+1.5);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.12, now+D); g.gain.exponentialRampToValueAtTime(0.001, now+D+1.5);
      osc.connect(g).connect(ctx.destination); osc.start(now+D); osc.stop(now+D+1.5);
      break;
    }
    case 'zauberpfeil': {
      for (let i = 0; i < 7; i++) {
        const t = i*0.08;
        const osc = ctx.createOscillator(); osc.type='triangle';
        osc.frequency.setValueAtTime(500+i*120, now+D+t);
        osc.frequency.exponentialRampToValueAtTime(150, now+D+t+0.5);
        const g = ctx.createGain(); g.gain.setValueAtTime(0.15, now+D+t);
        g.gain.exponentialRampToValueAtTime(0.001, now+D+t+0.5);
        osc.connect(g).connect(ctx.destination); osc.start(now+D+t); osc.stop(now+D+t+0.5);
      }
      // Whoosh
      const n = makeNoise(ctx, 0.6, 0.2);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.setValueAtTime(500, now+D); bp.frequency.exponentialRampToValueAtTime(2000, now+D+0.3);
      bp.Q.value=0.5;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.2, now+D); ng.gain.exponentialRampToValueAtTime(0.001, now+D+0.5);
      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now+D);
      break;
    }
  }
}

// ===== CAST SPELL =====
const castEffectEl = document.getElementById('castEffect');
const spellDisplayEl = document.getElementById('spellDisplay');
const spellDisplayNameEl = document.getElementById('spellDisplayName');
const spellDisplayDescEl = document.getElementById('spellDisplayDesc');

let lastCastTime = 0;
function castSpell(spellKey) {
  const spell = spells[spellKey];
  if (!spell) return;
  const now = Date.now();
  if (now - lastCastTime < 1200) return;
  lastCastTime = now;

  const cx = W / 2, cy = H / 2;

  // === Phase 1: Universal cast (immediate) ===
  playCastSound();
  spawnChargeParticles(cx, cy, spell.hue);

  // Magic circle starts immediately
  magicCircle.active = true;
  magicCircle.targetRadius = Math.min(W, H) * 0.28;
  magicCircle.hue = spell.hue;

  // Show spell name immediately
  spellDisplayNameEl.textContent = spell.name;
  spellDisplayNameEl.style.color = spell.color;
  spellDisplayDescEl.textContent = spell.desc;
  spellDisplayDescEl.style.color = spell.color;
  spellDisplayEl.classList.add('show');
  setTimeout(() => spellDisplayEl.classList.remove('show'), 2200);

  // Start spell-specific sound (has built-in DELAY offset)
  playSpellSound(spellKey);

  // === Phase 2: Spell effect fires after delay ===
  setTimeout(() => {
    // Screen flash
    castEffectEl.classList.add('flash');
    setTimeout(() => {
      castEffectEl.classList.remove('flash');
      castEffectEl.style.background = spell.screenColor;
      castEffectEl.classList.add('active');
      setTimeout(() => castEffectEl.classList.remove('active'), 600);
    }, 80);

    // Screen shake
    document.body.classList.add('shaking');
    setTimeout(() => document.body.classList.remove('shaking'), 300);

    // Fire spell particles
    spell.cast(cx, cy);
  }, DELAY);

  setTimeout(() => { magicCircle.active = false; }, 2500);
}

// ===== DETECT SPELL FROM TEXT =====
// Levenshtein distance for fuzzy matching
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const d = Array.from({length: m+1}, (_,i) => {
    const row = new Array(n+1);
    row[0] = i;
    return row;
  });
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    }
  }
  return d[m][n];
}

// Katakana <-> Hiragana conversion for flexible matching
function kataToHira(str) {
  return str.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

function detectSpell(text) {
  const t = text.toLowerCase().trim();
  const tHira = kataToHira(t);

  // Pass 1: Exact substring match (highest priority)
  for (const [key, spell] of Object.entries(spells)) {
    for (const kw of spell.keywords) {
      const kwLower = kw.toLowerCase();
      if (t.includes(kwLower) || tHira.includes(kataToHira(kwLower))) return key;
    }
  }

  // Pass 2: Fuzzy match - compare each word in transcript against keywords
  // Split by common delimiters and also try sliding window
  let bestMatch = null;
  let bestScore = Infinity;
  const threshold = 2; // Allow up to 2 character edits

  for (const [key, spell] of Object.entries(spells)) {
    for (const kw of spell.keywords) {
      if (kw.length < 3) continue; // Skip very short keywords for fuzzy
      const kwH = kataToHira(kw.toLowerCase());
      const kwLen = kwH.length;

      // Sliding window over the transcript
      for (let start = 0; start <= tHira.length - Math.max(1, kwLen - threshold); start++) {
        const windowSize = Math.min(kwLen + threshold, tHira.length - start);
        for (let ws = Math.max(2, kwLen - threshold); ws <= windowSize; ws++) {
          const sub = tHira.substring(start, start + ws);
          const dist = levenshtein(sub, kwH);
          // Dynamic threshold: allow more edits for longer words
          const dynThreshold = Math.min(threshold, Math.floor(kwH.length * 0.35));
          if (dist <= dynThreshold && dist < bestScore) {
            bestScore = dist;
            bestMatch = key;
          }
        }
      }
    }
  }
  return bestMatch;
}

// ===== SPEECH RECOGNITION =====
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
let recognition = null, isListening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'ja-JP';
  recognition.maxAlternatives = 3;

  recognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      for (let j = 0; j < result.length; j++) {
        const transcript = result[j].transcript;
        if (result.isFinal) { final += transcript; } else { if (j===0) interim += transcript; }
        const detected = detectSpell(transcript);
        if (detected && result.isFinal) {
          transcriptEl.textContent = `✦ ${transcript} ✦`;
          castSpell(detected);
          return;
        }
      }
    }
    if (final) {
      transcriptEl.textContent = final;
      const d = detectSpell(final); if (d) castSpell(d);
    } else if (interim) {
      transcriptEl.textContent = interim;
      const d = detectSpell(interim); if (d) castSpell(d);
    }
  };
  recognition.onstart = () => { isListening=true; micBtn.classList.add('listening'); statusEl.textContent='聴いています... 呪文を唱えてください'; };
  recognition.onend = () => { if (isListening) { try{recognition.start();}catch(e){} } else { micBtn.classList.remove('listening'); statusEl.textContent='タップしてマイクを起動'; } };
  recognition.onerror = (e) => {
    if (e.error==='not-allowed') { statusEl.textContent='マイクへのアクセスが拒否されました'; isListening=false; micBtn.classList.remove('listening'); }
    else if (e.error!=='no-speech' && e.error!=='aborted') { statusEl.textContent=`エラー: ${e.error}`; }
  };
} else {
  statusEl.innerHTML='';
  const ns = document.createElement('div'); ns.className='no-speech';
  ns.innerHTML='お使いのブラウザは音声認識に対応していません。<br>Chrome または Edge をお使いください。<br><br>画面下の呪文をタップして試せます！';
  document.getElementById('ui').appendChild(ns);
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (isListening) { isListening=false; recognition.stop(); }
  else { isListening=true; transcriptEl.textContent=''; try{recognition.start();}catch(e){recognition.stop();setTimeout(()=>recognition.start(),100);} }
});

// Click spell tags to cast
document.querySelectorAll('.spell-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    const key = tag.dataset.spell;
    if (key && spells[key]) {
      transcriptEl.textContent = `✦ ${spells[key].name} ✦`;
      castSpell(key);
    }
  });
});

// ===== ANIMATION LOOP =====
function animate() {
  ctx.fillStyle = 'rgba(10,10,26,0.15)';
  ctx.fillRect(0, 0, W, H);
  drawAmbient();
  if (magicCircle.active) {
    magicCircle.radius += (magicCircle.targetRadius - magicCircle.radius)*0.08;
    magicCircle.opacity += (0.8 - magicCircle.opacity)*0.08;
  } else {
    magicCircle.opacity *= 0.96;
    magicCircle.radius *= 0.98;
  }
  drawMagicCircle();
  spellParticles.forEach(p => { p.update(); p.draw(ctx); });
  spellParticles = spellParticles.filter(p => p.life > 0);
  requestAnimationFrame(animate);
}
animate();
</script>
