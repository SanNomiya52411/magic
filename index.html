<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Magic - 声で魔法を唱えよう</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');
  body{
    overflow:hidden;
    background:#0a0a1a;
    font-family:'MedievalSharp','Georgia',serif;
    color:#e0d8c8;
    user-select:none;
  }
  canvas#magicCanvas{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;
  }
  #ui{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #ui>*{pointer-events:auto}
  h1{
    font-size:clamp(1.8rem,5vw,3.5rem);
    text-align:center;
    background:linear-gradient(135deg,#f0c27f,#fc5c7d,#6a82fb);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:10px;
    text-shadow:0 0 40px rgba(106,130,251,.3);
    filter:drop-shadow(0 0 10px rgba(240,194,127,.3));
  }
  #subtitle{
    font-size:clamp(.85rem,2vw,1.1rem);opacity:.7;margin-bottom:30px;text-align:center;
  }
  #micBtn{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#2a1f4e,#1a1035);
    border:3px solid rgba(106,130,251,.4);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .3s;position:relative;
    box-shadow:0 0 30px rgba(106,130,251,.2),inset 0 0 30px rgba(106,130,251,.1);
  }
  #micBtn:hover{transform:scale(1.08);border-color:rgba(106,130,251,.8);box-shadow:0 0 50px rgba(106,130,251,.4)}
  #micBtn.listening{
    border-color:#fc5c7d;
    box-shadow:0 0 50px rgba(252,92,125,.5),inset 0 0 30px rgba(252,92,125,.2);
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 50px rgba(252,92,125,.5)}
    50%{box-shadow:0 0 80px rgba(252,92,125,.8)}
  }
  #micBtn svg{width:48px;height:48px;fill:#e0d8c8;transition:fill .3s}
  #micBtn.listening svg{fill:#fc5c7d}
  #micRing{
    position:absolute;width:100%;height:100%;border-radius:50%;
    border:2px solid transparent;animation:none;
  }
  #micBtn.listening #micRing{
    border-color:rgba(252,92,125,.5);animation:ringPulse 2s infinite;
  }
  @keyframes ringPulse{
    0%{transform:scale(1);opacity:1}
    100%{transform:scale(1.8);opacity:0}
  }
  #status{
    margin-top:20px;font-size:1rem;opacity:.8;
    min-height:1.5em;text-align:center;transition:all .3s;
  }
  #transcript{
    margin-top:10px;font-size:1.4rem;
    min-height:1.8em;text-align:center;
    color:#f0c27f;
    text-shadow:0 0 20px rgba(240,194,127,.5);
    transition:all .3s;
  }
  #spellBook{
    position:fixed;bottom:0;left:0;right:0;
    z-index:3;pointer-events:auto;
    background:rgba(10,10,26,.9);
    border-top:1px solid rgba(106,130,251,.3);
    padding:10px 15px 12px;
    backdrop-filter:blur(10px);
    max-height:40vh;overflow-y:auto;
  }
  #spellBook h3{
    font-size:.85rem;opacity:.6;margin-bottom:6px;text-align:center;
  }
  .spell-category{
    margin-bottom:6px;
  }
  .spell-category-label{
    font-size:.7rem;opacity:.4;margin-bottom:3px;padding-left:4px;
  }
  #spellList{
    display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
  }
  .spell-tag{
    padding:3px 10px;border-radius:16px;font-size:.75rem;
    cursor:pointer;transition:all .3s;white-space:nowrap;
  }
  .spell-tag:hover{transform:scale(1.08);filter:brightness(1.3)}
  .cat-fire{background:rgba(255,80,30,.2);border:1px solid rgba(255,80,30,.4);color:#ff8855}
  .cat-lightning{background:rgba(255,255,80,.2);border:1px solid rgba(255,255,80,.4);color:#ffff88}
  .cat-ice{background:rgba(100,180,255,.2);border:1px solid rgba(100,180,255,.4);color:#88ccff}
  .cat-heal{background:rgba(80,255,120,.2);border:1px solid rgba(80,255,120,.4);color:#80ff88}
  .cat-water{background:rgba(80,160,255,.2);border:1px solid rgba(80,160,255,.4);color:#66aaff}
  .cat-shield{background:rgba(80,220,220,.2);border:1px solid rgba(80,220,220,.4);color:#77dddd}
  .cat-utility{background:rgba(180,130,255,.2);border:1px solid rgba(180,130,255,.4);color:#bb99ff}
  .cat-enhance{background:rgba(255,215,80,.2);border:1px solid rgba(255,215,80,.4);color:#ffdd66}
  .cat-detect{background:rgba(130,180,255,.2);border:1px solid rgba(130,180,255,.4);color:#99bbff}

  #castEffect{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:10;pointer-events:none;opacity:0;transition:opacity .3s;
  }
  #castEffect.active{opacity:1}
  #spellDisplay{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:11;pointer-events:none;text-align:center;
    opacity:0;transition:all .5s;
  }
  #spellDisplay.show{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  #spellDisplayName{
    font-size:clamp(2rem,8vw,4.5rem);
    text-shadow:0 0 40px currentColor;
  }
  #spellDisplayDesc{
    font-size:clamp(.9rem,2.5vw,1.3rem);
    opacity:.7;margin-top:5px;
  }
  .no-speech{
    font-size:.85rem;opacity:.5;margin-top:15px;text-align:center;
    max-width:400px;line-height:1.5;
  }
</style>
</head>
<body>
<canvas id="magicCanvas"></canvas>
<div id="castEffect"></div>
<div id="spellDisplay">
  <div id="spellDisplayName"></div>
  <div id="spellDisplayDesc"></div>
</div>
<div id="ui">
  <h1>Voice Magic</h1>
  <div id="subtitle">マイクに向かって呪文を唱えよう</div>
  <button id="micBtn" aria-label="マイクを起動">
    <div id="micRing"></div>
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <div id="status">タップしてマイクを起動</div>
  <div id="transcript"></div>
</div>
<div id="spellBook">
  <h3>📖 呪文一覧 - Spell Book</h3>
  <div id="spellList">
    <span class="spell-tag cat-fire" data-spell="feilanze">ファイランツェ (炎の槍)</span>
    <span class="spell-tag cat-fire" data-spell="feuerball">フォイアーバル (火球)</span>
    <span class="spell-tag cat-lightning" data-spell="blitzpfeil">ブリツォール (雷の矢)</span>
    <span class="spell-tag cat-ice" data-spell="frostspeer">フロスピア (氷の槍)</span>
    <span class="spell-tag cat-heal" data-spell="schnellheil">シュネルハイル (応急手当)</span>
    <span class="spell-tag cat-water" data-spell="siedeln">ジーデルン (お湯を沸かす)</span>
    <span class="spell-tag cat-shield" data-spell="barriere">バリエーレ (簡素防護)</span>
    <span class="spell-tag cat-shield" data-spell="gardiere">ガーディエーレ (強化防護)</span>
    <span class="spell-tag cat-shield" data-spell="bastiere">バスティエーレ (鉄壁)</span>
    <span class="spell-tag cat-utility" data-spell="flicken">フリッケン (服を治す)</span>
    <span class="spell-tag cat-utility" data-spell="schleiern">シュライアン (記憶を曇らせる)</span>
    <span class="spell-tag cat-enhance" data-spell="sichtbar">ジヒトバール (イブングハジの粉)</span>
    <span class="spell-tag cat-enhance" data-spell="glanzklinge">グランツクリンゲ (光る刃)</span>
    <span class="spell-tag cat-enhance" data-spell="eisenleib">アイゼンライプ (鉄の体)</span>
    <span class="spell-tag cat-detect" data-spell="manasinn">マナジン (魔力探知)</span>
    <span class="spell-tag cat-detect" data-spell="zauberpfeil">ツァウベロール (魔法の矢)</span>
  </div>
</div>
<script>
// ===== CANVAS SETUP =====
const canvas = document.getElementById('magicCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// ===== AMBIENT PARTICLES =====
const ambientParticles = [];
for (let i = 0; i < 60; i++) {
  ambientParticles.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 2 + 0.5,
    dx: (Math.random() - 0.5) * 0.3, dy: (Math.random() - 0.5) * 0.3 - 0.2,
    opacity: Math.random() * 0.5 + 0.1, hue: Math.random() * 60 + 220,
  });
}
function drawAmbient() {
  ambientParticles.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.y < -10) p.y = H + 10;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue},70%,70%,${p.opacity})`;
    ctx.fill();
  });
}

// ===== MAGIC CIRCLE =====
let magicCircle = { active: false, radius: 0, targetRadius: 0, opacity: 0, rotation: 0, hue: 240 };
function drawMagicCircle() {
  if (magicCircle.opacity < 0.01) return;
  const cx = W / 2, cy = H / 2;
  magicCircle.rotation += 0.005;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(magicCircle.rotation);
  ctx.globalAlpha = magicCircle.opacity;
  ctx.beginPath(); ctx.arc(0, 0, magicCircle.radius, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${magicCircle.hue},80%,70%,0.6)`; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, magicCircle.radius * 0.7, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${magicCircle.hue},80%,70%,0.4)`; ctx.lineWidth = 1.5; ctx.stroke();
  const sides = 6;
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const x1 = Math.cos(a) * magicCircle.radius * 0.85, y1 = Math.sin(a) * magicCircle.radius * 0.85;
    const x2 = Math.cos(a + Math.PI * 2 / sides) * magicCircle.radius * 0.85;
    const y2 = Math.sin(a + Math.PI * 2 / sides) * magicCircle.radius * 0.85;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = `hsla(${magicCircle.hue},80%,70%,0.3)`; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${magicCircle.hue},80%,80%,0.6)`; ctx.fill();
  }
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + magicCircle.rotation * 2;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * magicCircle.radius * 0.65, Math.sin(a) * magicCircle.radius * 0.65);
    ctx.strokeStyle = `hsla(${magicCircle.hue},60%,60%,0.2)`; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
}

// ===== SPELL PARTICLES =====
let spellParticles = [];
class SP {
  constructor(x, y, c) {
    this.x = x; this.y = y;
    this.vx = c.vx || 0; this.vy = c.vy || 0;
    this.life = c.life || 1; this.decay = c.decay || 0.01;
    this.r = c.r || 3; this.hue = c.hue || 0;
    this.sat = c.sat || 80; this.light = c.light || 60;
    this.gravity = c.gravity || 0; this.trail = c.trail || false;
    this.th = []; this.friction = c.friction || 0.99;
    this.glow = c.glow || false;
  }
  update() {
    if (this.trail) { this.th.push({x:this.x,y:this.y}); if (this.th.length > 8) this.th.shift(); }
    this.vx *= this.friction; this.vy *= this.friction;
    this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
    this.life -= this.decay;
  }
  draw(c) {
    if (this.life <= 0) return;
    const a = Math.max(0, this.life);
    if (this.trail) {
      for (let i = 0; i < this.th.length; i++) {
        const t = this.th[i], ta = (i / this.th.length) * a * 0.5;
        c.beginPath(); c.arc(t.x, t.y, this.r * (i / this.th.length), 0, Math.PI * 2);
        c.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${ta})`; c.fill();
      }
    }
    if (this.glow) { c.save(); c.shadowBlur = 20; c.shadowColor = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`; }
    c.beginPath(); c.arc(this.x, this.y, this.r * a, 0, Math.PI * 2);
    c.fillStyle = `hsla(${this.hue},${this.sat}%,${this.light}%,${a})`; c.fill();
    if (this.glow) c.restore();
  }
}

// ===== SPELL DEFINITIONS =====
const spells = {
  feilanze: {
    name: 'ファイランツェ', desc: '炎の槍',
    keywords: ['ファイランツェ', 'ふぁいらんつぇ', '炎の槍', 'ファイラン'],
    hue: 15, color: '#ff6030', screenColor: 'rgba(255,60,20,0.15)',
    cast(cx, cy) {
      // Fire lance shooting upward
      for (let i = 0; i < 80; i++) {
        const spread = (Math.random() - 0.5) * 2;
        const speed = Math.random() * 10 + 6;
        spellParticles.push(new SP(cx + spread * 20, cy + 50, {
          vx: spread * 2, vy: -speed,
          hue: Math.random() * 35, sat: 95, light: 55 + Math.random() * 25,
          r: Math.random() * 5 + 2, gravity: -0.02, decay: 0.008,
          trail: true, glow: true, friction: 0.985,
        }));
      }
      // Lance tip sparks
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          spellParticles.push(new SP(cx + (Math.random()-0.5)*30, cy - 200 - Math.random()*100, {
            vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
            hue: 40+Math.random()*20, sat: 100, light: 80,
            r: Math.random()*3+1, decay: 0.02, glow: true, friction: 0.95,
          }));
        }, i * 15);
      }
    }
  },
  feuerball: {
    name: 'フォイアーバル', desc: '火球を放つ',
    keywords: ['フォイアーバル', 'ふぉいあーばる', '火球', 'フォイアー'],
    hue: 20, color: '#ff4020', screenColor: 'rgba(255,50,10,0.18)',
    cast(cx, cy) {
      // Expanding fireball
      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        spellParticles.push(new SP(cx, cy, {
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          hue: Math.random() * 40, sat: 95, light: 50 + Math.random() * 25,
          r: Math.random() * 7 + 2, gravity: -0.03, decay: 0.007,
          trail: true, glow: true, friction: 0.975,
        }));
      }
      // Core explosion flash
      for (let i = 0; i < 40; i++) {
        spellParticles.push(new SP(cx, cy, {
          vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3,
          hue: 45, sat: 100, light: 90,
          r: Math.random() * 10 + 5, decay: 0.015, glow: true, friction: 0.98,
        }));
      }
    }
  },
  blitzpfeil: {
    name: 'ブリツォール', desc: '雷の矢',
    keywords: ['ブリツォール', 'ぶりつぉーる', '雷の矢', 'ブリツォ'],
    hue: 55, color: '#ffff50', screenColor: 'rgba(255,255,80,0.2)',
    cast(cx, cy) {
      // Lightning arrow from top to center
      for (let b = 0; b < 3; b++) {
        let lx = cx + (Math.random()-0.5)*60;
        let ly = 0;
        while (ly < cy) {
          const nlx = lx + (Math.random()-0.5)*40;
          const nly = ly + Math.random()*30+15;
          for (let i = 0; i < 6; i++) {
            const t = i / 6;
            spellParticles.push(new SP(
              lx+(nlx-lx)*t+(Math.random()-0.5)*4,
              ly+(nly-ly)*t+(Math.random()-0.5)*4, {
                vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
                hue: 50+Math.random()*15, sat: 100, light: 85+Math.random()*15,
                r: Math.random()*3+1, decay: 0.025, glow: true, friction: 0.95,
              }));
          }
          lx = nlx; ly = nly;
        }
      }
      // Impact sparks
      for (let i = 0; i < 60; i++) {
        const angle = Math.random()*Math.PI*2;
        const sp = Math.random()*7+2;
        spellParticles.push(new SP(cx, cy, {
          vx: Math.cos(angle)*sp, vy: Math.sin(angle)*sp,
          hue: 55, sat: 100, light: 90,
          r: Math.random()*2+0.5, decay: 0.025, trail: true, glow: true, friction: 0.96,
        }));
      }
    }
  },
  frostspeer: {
    name: 'フロスピア', desc: '氷の槍',
    keywords: ['フロスピア', 'ふろすぴあ', '氷の槍', 'フロス'],
    hue: 200, color: '#60c0ff', screenColor: 'rgba(80,180,255,0.15)',
    cast(cx, cy) {
      // Ice lance shooting upward
      for (let i = 0; i < 70; i++) {
        const spread = (Math.random()-0.5)*1.5;
        const speed = Math.random()*9+5;
        spellParticles.push(new SP(cx+spread*15, cy+40, {
          vx: spread*1.5, vy: -speed,
          hue: 195+Math.random()*20, sat: 70, light: 70+Math.random()*20,
          r: Math.random()*4+1.5, decay: 0.007, trail: true, glow: true, friction: 0.985,
        }));
      }
      // Ice crystals at tip
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const angle = Math.random()*Math.PI*2;
          spellParticles.push(new SP(cx+(Math.random()-0.5)*40, cy-220-Math.random()*80, {
            vx: Math.cos(angle)*2, vy: Math.sin(angle)*2,
            hue: 200, sat: 50, light: 90,
            r: Math.random()*3+1, decay: 0.015, glow: true, friction: 0.96,
          }));
        }, i*12);
      }
      // Frost mist
      for (let i = 0; i < 30; i++) {
        spellParticles.push(new SP(cx+(Math.random()-0.5)*100, cy, {
          vx: (Math.random()-0.5)*1, vy: -Math.random()*1-0.5,
          hue: 200, sat: 40, light: 85,
          r: Math.random()*6+3, decay: 0.004, glow: false, friction: 0.998,
        }));
      }
    }
  },
  schnellheil: {
    name: 'シュネルハイル', desc: '応急手当',
    keywords: ['シュネルハイル', 'しゅねるはいる', '応急手当', 'シュネル'],
    hue: 140, color: '#50ff78', screenColor: 'rgba(80,255,120,0.1)',
    cast(cx, cy) {
      // Gentle healing particles rising
      for (let i = 0; i < 80; i++) {
        const x = cx + (Math.random()-0.5)*250;
        const y = cy + Math.random()*150;
        spellParticles.push(new SP(x, y, {
          vx: (Math.random()-0.5)*0.8, vy: -Math.random()*2.5-0.8,
          hue: 120+Math.random()*40, sat: 65, light: 65+Math.random()*20,
          r: Math.random()*3.5+1.5, gravity: -0.015, decay: 0.005,
          trail: true, glow: true, friction: 0.995,
        }));
      }
      // Heal cross
      for (let i = 0; i < 30; i++) {
        const onX = Math.random() > 0.5;
        const offset = (Math.random()-0.5)*80;
        spellParticles.push(new SP(
          onX ? cx+offset : cx, onX ? cy : cy+offset, {
            vx: (Math.random()-0.5)*0.5, vy: -Math.random()*1.5-0.5,
            hue: 130, sat: 80, light: 85,
            r: Math.random()*2+1, decay: 0.008, glow: true, friction: 0.99,
          }));
      }
    }
  },
  siedeln: {
    name: 'ジーデルン', desc: 'お湯を沸かす',
    keywords: ['ジーデルン', 'じーでるん', 'お湯', 'ジーデ'],
    hue: 210, color: '#6699ff', screenColor: 'rgba(80,130,255,0.1)',
    cast(cx, cy) {
      // Bubbles rising from below
      for (let wave = 0; wave < 4; wave++) {
        setTimeout(() => {
          for (let i = 0; i < 25; i++) {
            const x = cx + (Math.random()-0.5)*200;
            spellParticles.push(new SP(x, cy+100+Math.random()*50, {
              vx: (Math.random()-0.5)*1.5, vy: -Math.random()*3-1.5,
              hue: 200+Math.random()*20, sat: 60, light: 70+Math.random()*15,
              r: Math.random()*6+3, gravity: -0.04, decay: 0.005,
              trail: false, glow: true, friction: 0.995,
            }));
          }
        }, wave * 250);
      }
      // Steam
      for (let i = 0; i < 40; i++) {

// ===== SOUND EFFECTS (Web Audio API) =====
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
  return audioCtx;
}

function makeNoise(ctx, duration, decayTime) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*decayTime));
  const src = ctx.createBufferSource(); src.buffer = buf;
  return src;
}

function playSpellSound(type) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  switch(type) {
    case 'feilanze': {
      // Fiery whoosh ascending
      const osc = ctx.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(600, now+0.3);
      osc.frequency.exponentialRampToValueAtTime(200, now+0.6);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.6);
      osc.connect(g).connect(ctx.destination); osc.start(now); osc.stop(now+0.6);
      const n = makeNoise(ctx, 0.5, 0.2);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.5;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.3, now); ng.gain.exponentialRampToValueAtTime(0.001, now+0.5);
      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now);
      break;
    }
    case 'feuerball': {
      // Explosion whoosh
      const n = makeNoise(ctx, 1, 0.4);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=600; bp.Q.value=0.3;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.9);
      n.connect(bp).connect(g).connect(ctx.destination); n.start(now);
      const osc = ctx.createOscillator(); osc.type='sawtooth';
      osc.frequency.setValueAtTime(80, now); osc.frequency.exponentialRampToValueAtTime(30, now+0.8);
      const og = ctx.createGain(); og.gain.setValueAtTime(0.2, now); og.gain.exponentialRampToValueAtTime(0.001, now+0.8);

    case 'blitzpfeil': {

      [220,330,440,550].forEach((f,i) => {
        const osc = ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=f;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.1, now+i*0.05);
        g.gain.exponentialRampToValueAtTime(0.001, now+0.8);
        osc.connect(g).connect(ctx.destination); osc.start(now+i*0.05); osc.stop(now+0.8);
      });
      break;
    }
    case 'bastiere': {
      // Heavy impact + metallic
      const osc = ctx.createOscillator(); osc.type='sawtooth';
      osc.frequency.setValueAtTime(60, now); osc.frequency.exponentialRampToValueAtTime(25, now+0.8);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.8);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200;
      osc.connect(lp).connect(g).connect(ctx.destination); osc.start(now); osc.stop(now+0.8);
      const n = makeNoise(ctx, 0.5, 0.15);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3000; bp.Q.value=2;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.2, now); ng.gain.exponentialRampToValueAtTime(0.001, now+0.3);
      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now);
      break;
    }
    case 'flicken': {
      // Tiny twinkling
      for (let i = 0; i < 6; i++) {
        const t = i*0.15;
        const osc = ctx.createOscillator(); osc.type='sine';
        osc.frequency.value = 800+i*200;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, now+t);
        g.gain.linearRampToValueAtTime(0.06, now+t+0.03);
        g.gain.exponentialRampToValueAtTime(0.001, now+t+0.2);
        osc.connect(g).connect(ctx.destination); osc.start(now+t); osc.stop(now+t+0.2);
      }
      break;
    }
    case 'schleiern': {
      // Eerie drone
      const osc = ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=65;
      const lfo = ctx.createOscillator(); lfo.frequency.value=3;
      const lfoG = ctx.createGain(); lfoG.gain.value=8;
      lfo.connect(lfoG).connect(osc.frequency);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now+1.2);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=250;
      osc.connect(lp).connect(g).connect(ctx.destination);
      osc.start(now); lfo.start(now); osc.stop(now+1.2); lfo.stop(now+1.2);
      // High whisper
      const n = makeNoise(ctx, 1, 0.5);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4000; bp.Q.value=3;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.04, now); ng.gain.exponentialRampToValueAtTime(0.001, now+1);
      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now);
      break;
    }
    case 'sichtbar': {
      // Sparkle cascade
      for (let i = 0; i < 10; i++) {
        const t = i*0.08;
        const f = 1200+Math.random()*2000;
        const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, now+t);
        g.gain.linearRampToValueAtTime(0.06, now+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now+t+0.15);
        osc.connect(g).connect(ctx.destination); osc.start(now+t); osc.stop(now+t+0.15);
      }
      break;
    }
    case 'glanzklinge': {
      // Blade slash whoosh
      const n = makeNoise(ctx, 0.3, 0.1);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.setValueAtTime(500, now); bp.frequency.exponentialRampToValueAtTime(3000, now+0.15);
      bp.Q.value=1;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.3);
      n.connect(bp).connect(g).connect(ctx.destination); n.start(now);
      // Ring
      const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=2000;
      const og = ctx.createGain(); og.gain.setValueAtTime(0.1, now+0.1); og.gain.exponentialRampToValueAtTime(0.001, now+0.5);
      osc.connect(og).connect(ctx.destination); osc.start(now+0.1); osc.stop(now+0.5);
      break;
    }
    case 'eisenleib': {
      // Metallic resonance
      [150,300,450].forEach((f,i) => {
        const osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=f;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.06, now+i*0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now+0.8);
        osc.connect(g).connect(ctx.destination); osc.start(now+i*0.1); osc.stop(now+0.8);
      });
      const n = makeNoise(ctx, 0.4, 0.1);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5000; bp.Q.value=5;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(0.15, now); ng.gain.exponentialRampToValueAtTime(0.001, now+0.2);
      n.connect(bp).connect(ng).connect(ctx.destination); n.start(now);
      break;
    }
    case 'manasinn': {
      // Radar ping
      for (let i = 0; i < 5; i++) {
        const t = i*0.3;
        const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=880;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, now+t);
        g.gain.linearRampToValueAtTime(0.12, now+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now+t+0.3);
        osc.connect(g).connect(ctx.destination); osc.start(now+t); osc.stop(now+t+0.3);
      }
      break;
    }
    case 'zauberpfeil': {
      // Magic missile whoosh
      for (let i = 0; i < 5; i++) {
        const t = i*0.1;
        const osc = ctx.createOscillator(); osc.type='triangle';
        osc.frequency.setValueAtTime(400+i*100, now+t);
        osc.frequency.exponentialRampToValueAtTime(200, now+t+0.4);
        const g = ctx.createGain(); g.gain.setValueAtTime(0.1, now+t);
        g.gain.exponentialRampToValueAtTime(0.001, now+t+0.4);
        osc.connect(g).connect(ctx.destination); osc.start(now+t); osc.stop(now+t+0.4);
      }
      break;
    }
  }
}

// ===== CAST SPELL =====
const castEffectEl = document.getElementById('castEffect');
const spellDisplayEl = document.getElementById('spellDisplay');
const spellDisplayNameEl = document.getElementById('spellDisplayName');
const spellDisplayDescEl = document.getElementById('spellDisplayDesc');

let lastCastTime = 0;
function castSpell(spellKey) {
  const spell = spells[spellKey];
  if (!spell) return;
  // Prevent rapid re-cast of same spell
  const now = Date.now();
  if (now - lastCastTime < 800) return;
  lastCastTime = now;

  const cx = W / 2, cy = H / 2;

  magicCircle.active = true;
  magicCircle.targetRadius = Math.min(W, H) * 0.22;
  magicCircle.hue = spell.hue;

  castEffectEl.style.background = spell.screenColor;
  castEffectEl.classList.add('active');
  setTimeout(() => castEffectEl.classList.remove('active'), 500);

  spellDisplayNameEl.textContent = spell.name;
  spellDisplayNameEl.style.color = spell.color;
  spellDisplayDescEl.textContent = spell.desc;
  spellDisplayDescEl.style.color = spell.color;
  spellDisplayEl.classList.add('show');
  setTimeout(() => spellDisplayEl.classList.remove('show'), 1800);

  playSpellSound(spellKey);
  spell.cast(cx, cy);

  setTimeout(() => { magicCircle.active = false; }, 2000);
}

// ===== DETECT SPELL FROM TEXT =====
function detectSpell(text) {
  const t = text.toLowerCase().trim();
  for (const [key, spell] of Object.entries(spells)) {
    for (const kw of spell.keywords) {
      if (t.includes(kw.toLowerCase())) return key;
    }
  }
  return null;
}

// ===== SPEECH RECOGNITION =====
const micBtn = document.getElementById('micBtn');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
let recognition = null, isListening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'ja-JP';
  recognition.maxAlternatives = 3;

  recognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      for (let j = 0; j < result.length; j++) {
        const transcript = result[j].transcript;
        if (result.isFinal) { final += transcript; } else { if (j===0) interim += transcript; }
        const detected = detectSpell(transcript);
        if (detected && result.isFinal) {
          transcriptEl.textContent = `✦ ${transcript} ✦`;
          castSpell(detected);
          return;
        }
      }
    }
    if (final) {
      transcriptEl.textContent = final;
      const d = detectSpell(final); if (d) castSpell(d);
    } else if (interim) {
      transcriptEl.textContent = interim;
      const d = detectSpell(interim); if (d) castSpell(d);
    }
  };
  recognition.onstart = () => { isListening=true; micBtn.classList.add('listening'); statusEl.textContent='聴いています... 呪文を唱えてください'; };
  recognition.onend = () => { if (isListening) { try{recognition.start();}catch(e){} } else { micBtn.classList.remove('listening'); statusEl.textContent='タップしてマイクを起動'; } };
  recognition.onerror = (e) => {
    if (e.error==='not-allowed') { statusEl.textContent='マイクへのアクセスが拒否されました'; isListening=false; micBtn.classList.remove('listening'); }
    else if (e.error!=='no-speech' && e.error!=='aborted') { statusEl.textContent=`エラー: ${e.error}`; }
  };
} else {
  statusEl.innerHTML='';
  const ns = document.createElement('div'); ns.className='no-speech';
  ns.innerHTML='お使いのブラウザは音声認識に対応していません。<br>Chrome または Edge をお使いください。<br><br>画面下の呪文をタップして試せます！';
  document.getElementById('ui').appendChild(ns);
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (isListening) { isListening=false; recognition.stop(); }
  else { isListening=true; transcriptEl.textContent=''; try{recognition.start();}catch(e){recognition.stop();setTimeout(()=>recognition.start(),100);} }
});

// Click spell tags to cast
document.querySelectorAll('.spell-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    const key = tag.dataset.spell;
    if (key && spells[key]) {
      transcriptEl.textContent = `✦ ${spells[key].name} ✦`;
      castSpell(key);
    }
  });
});

// ===== ANIMATION LOOP =====
function animate() {
  ctx.fillStyle = 'rgba(10,10,26,0.15)';
  ctx.fillRect(0, 0, W, H);
  drawAmbient();
  if (magicCircle.active) {
    magicCircle.radius += (magicCircle.targetRadius - magicCircle.radius)*0.08;
    magicCircle.opacity += (0.8 - magicCircle.opacity)*0.08;
  } else {
    magicCircle.opacity *= 0.96;
    magicCircle.radius *= 0.98;
  }
  drawMagicCircle();
  spellParticles.forEach(p => { p.update(); p.draw(ctx); });
  spellParticles = spellParticles.filter(p => p.life > 0);
  requestAnimationFrame(animate);
}
animate();
</script>
